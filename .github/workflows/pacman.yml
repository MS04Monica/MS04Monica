name: Update Pac-Man Contributions

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  update-pacman:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Pillow
        run: |
          python -m pip install --upgrade pip
          python -m pip install Pillow

      - name: Fetch GitHub contributions
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          python scripts/fetch_contributions.py

      - name: Generate Pac-Man animation
        run: |
          python scripts/generate_pacman.py

      - name: Commit updated Pac-Man calendar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/pacman/

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update Pac-Man contribution calendar"
            git push
          fi
